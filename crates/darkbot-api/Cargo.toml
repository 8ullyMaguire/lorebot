[package]
name = "darkbot-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Typed client for the Darkhold public API (§23.1)"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }

[dev-dependencies]
# A real HTTP server on localhost. The point is that the client is tested
# against actual status codes and bodies rather than against a hand-written
# mock of the client's own assumptions — a mock that agrees with the client
# proves nothing about whether the client agrees with the server.
wiremock = "0.6"
tokio = { version = "1", features = ["full"] }
