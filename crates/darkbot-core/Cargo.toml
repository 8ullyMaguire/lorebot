[package]
name = "darkbot-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Platform-neutral core for the Darkhold companion bot"

[dependencies]
# The wire contract, and nothing else. No database driver appears in this list
# or in any other manifest in this workspace, and `no_code_path_reaches_a_
# database` is a test over the lock file that fails if one is ever added.
darkbot-api = { path = "../darkbot-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
aes-gcm = "0.10"
# Used only in the error type, to name a transport failure. The API client owns the
# actual HTTP; the core never makes a request itself.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rand = "0.8"
base64 = "0.22"
hex = "0.4"
zeroize = { version = "1", features = ["derive", "serde"] }

[dev-dependencies]
tempfile = "3"
